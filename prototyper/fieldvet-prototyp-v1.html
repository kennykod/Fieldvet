.rec-dot.off { background: var(--ink-4); animation: none; }
.vs-transcript { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; min-height: 96px; }
.vs-transcript .lbl, .as-draft .lbl { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.vs-transcript p { margin-top: 4px; font-size: 15px; line-height: 1.45; }
.voicesheet .sheet-actions { flex-direction: column; }
.bubble.voice { min-width: 240px; gap: 6px; }
.bubble.pending { opacity: .7; }
.vb-row { display: flex; align-items: center; gap: 10px; }
.vb-play { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: #fff; flex: none; }
.bubble.me .vb-play { background: #fff; color: var(--brand); }
.vb-wave { display: flex; align-items: center; gap: 2px; flex: 1; height: 24px; }
.vb-wave i { width: 3px; border-radius: 2px; background: currentColor; opacity: .45; }
.vb-wave.on i { animation: wave2 .9s ease-in-out infinite; opacity: .9; }
.vb-wave.on i:nth-child(3n) { animation-delay: .2s; } .vb-wave.on i:nth-child(3n+1) { animation-delay: .4s; }
.vb-len { font-size: 12px; font-weight: 700; }
.vb-text { font-size: 13.5px; line-height: 1.4; opacity: .92; }

/* ——— assistant ——— */
.ask-btn { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 12px; border-radius: 20px; background: var(--ink); color: #fff; font-weight: 700; font-size: 14px; box-shadow: var(--sh-1); }
.assistant { min-height: 100%; padding-bottom: 0; }
.as-mode { display: flex; gap: 7px; align-items: center; font-size: 12.5px; font-weight: 700; padding: 7px 11px; border-radius: 10px; }
.as-mode.ai { background: var(--brand-tint); color: var(--brand-ink); }
.as-mode.lokal { background: var(--sunken); color: var(--ink-2); }
.as-mode.off { background: var(--ink); color: #E8ECEF; }
.as-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 24px 10px 6px; }
.as-empty h2 { font-family: var(--f-display); font-size: 24px; margin-top: 8px; }
.as-empty p { color: var(--ink-2); font-size: 14.5px; }
.as-orb { width: 86px; height: 86px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: radial-gradient(circle at 35% 30%, #4FA792, var(--brand) 60%, var(--brand-ink)); box-shadow: 0 0 0 12px var(--brand-soft); }
.as-thread { display: flex; flex-direction: column; gap: 10px; flex: 1; }
.as-turn { display: flex; flex-direction: column; gap: 6px; }
.as-a { max-width: 92% !important; font-size: 15px !important; }
.as-tag { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--ink-3); margin-top: 4px; }
.as-tag.ai { color: var(--brand); }
.dots { display: inline-flex; gap: 4px; padding: 4px 0; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-4); animation: blink 1s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
.as-draft { margin-top: 8px; border-radius: 12px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-2); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.as-draft p { font-size: 14px; }
.as-sent { font-size: 12.5px; font-weight: 700; color: var(--ok); }
.as-bottom { position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg) 82%, transparent); padding: 12px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.as-sugs { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.as-sugs .chipbtn { height: auto; min-height: 34px; padding: 6px 12px; text-align: left; white-space: normal; font-weight: 600; }
.as-listen { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--crit); font-weight: 700; }
.as-input { width: 100%; display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 24px; padding: 4px 4px 4px 14px; box-shadow: inset 0 0 0 1px var(--line-2); }
.as-input input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; height: 40px; font-size: 15px; }
.as-input .roundbtn { width: 40px; height: 40px; }
.as-mic { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: #fff; box-shadow: 0 0 0 8px var(--brand-soft), 0 12px 24px -10px var(--brand); }
.as-mic.on { background: var(--crit); box-shadow: 0 0 0 8px var(--crit-soft); }

/* ——— Slack-trådar (simulerad koppling) ——— */
.slackview { display: grid; grid-template-columns: 340px 1fr; min-height: 0; grid-row: 2 / 4; }
.sk-side { background: #2B2438; color: #E9E4F0; display: flex; flex-direction: column; min-height: 0; padding: 12px 10px; gap: 2px; }
.sk-ws { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 12px; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 8px; }
.sk-ws b { font-family: var(--f-display, inherit); font-size: 16px; color: #fff; }
.sk-ch { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 10px; border-radius: 8px; color: #C9C0D6; font-size: 14px; text-align: left; }
.sk-ch:hover { background: rgba(255,255,255,.07); }
.sk-ch.on { background: #4C63D2; color: #fff; }
.sk-ch.unread { color: #fff; font-weight: 700; }
.sk-count { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: #E0475B; color: #fff; font-size: 11.5px; font-weight: 700; display: grid; place-items: center; }
.sk-list { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.1); overflow: auto; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
.sk-empty { padding: 10px; color: #A99FB8; }
.sk-item { display: flex; flex-direction: column; gap: 3px; width: 100%; padding: 9px 10px; border-radius: 10px; text-align: left; color: #D8D1E3; position: relative; }
.sk-item:hover { background: rgba(255,255,255,.06); }
.sk-item.on { background: rgba(255,255,255,.13); }
.sk-item.unread::before { content: ''; position: absolute; left: -2px; top: 16px; width: 6px; height: 6px; border-radius: 50%; background: #E0475B; }
.sk-item .muted { color: #A99FB8; font-size: 12px; }
.sk-item-top { display: flex; justify-content: space-between; font-size: 12px; color: #A99FB8; }
.sk-item-who { display: flex; align-items: center; gap: 6px; }
.sk-item-who b { color: #fff; font-size: 13.5px; }
.sk-item.unread .sk-snip { color: #fff; }
.sk-snip { font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sk-n { font-size: 12px; color: #9DB0FF; font-weight: 600; }
.sk-tag { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; text-transform: uppercase; letter-spacing: .03em; }
.sk-tag.req { background: #F6C343; color: #3a2a00; }
.sk-tag.ok { background: #D7F0DC; color: #1E6B34; }
.sk-tag.big { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 5px 10px; text-transform: none; letter-spacing: 0; }
.sk-thread { display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
.sk-none { margin: auto; }
.sk-head { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--line); min-height: 56px; flex-wrap: wrap; }
.sk-head > span:first-child { display: inline-flex; align-items: center; gap: 4px; font-size: 15px; }
.sk-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.sk-body { flex: 1; overflow: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.sk-msg { display: grid; grid-template-columns: 36px 1fr; gap: 10px; }
.sk-msg p { margin: 2px 0 0; font-size: 14.5px; line-height: 1.45; color: var(--ink); }
.sk-msg.bot p { background: var(--surface-2); border-left: 3px solid var(--brand); padding: 8px 12px; border-radius: 0 8px 8px 0; }
.sk-meta { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
.sk-meta b { font-size: 14.5px; }
.sk-meta time { color: var(--ink-3); font-size: 12px; }
.sk-meta .muted { font-size: 12.5px; }
.sk-app { font-size: 9.5px; font-weight: 800; background: #EEF1F5; color: #3B4F66; padding: 1px 5px; border-radius: 4px; }
.sk-av { display: grid; place-items: center; border-radius: 8px; color: #fff; font-weight: 700; font-size: 12.5px; flex: none; }
.sk-av.bot { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.sk-divider { display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 12px; }
.sk-divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.sk-compose { border-top: 1px solid var(--line); }
.sk-compose .composer { border-top: 0; padding-bottom: 6px; }
.sk-note { display: flex; align-items: center; gap: 6px; margin: 0; padding: 0 20px 12px; font-size: 12px; color: var(--ink-3); }
@media (max-width: 900px) { .slackview { grid-template-columns: 260px 1fr; } }
.sk-count.req { background: #F6C343; color: #3a2a00; }

/* ——— Felskydd i demon ——— */
.crash { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg); padding: 24px; }
.crash-card { max-width: 420px; text-align: center; background: var(--surface); border-radius: 20px; padding: 28px 28px 24px; box-shadow: var(--sh-1); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.crash-card h2 { margin: 4px 0 0; font-size: 20px; }
.crash-card p { margin: 0 0 8px; color: var(--ink-2); }
.crash-ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--warn-soft, #FFF3D6); color: var(--warn, #B7791F); }

/* ——— Introduktion för besökare ——— */
.modal.welcome { width: min(560px, 100%); position: relative; padding: 30px 30px 24px; gap: 20px; overflow: auto; }
.wl-x { position: absolute; top: 14px; right: 14px; }
.wl-head { display: flex; flex-direction: column; gap: 10px; padding-right: 24px; }
.wl-head h2 { font-family: var(--f-display); font-size: 28px; line-height: 1.1; letter-spacing: -.015em; margin: 6px 0 0; }
.wl-head p { color: var(--ink-2); font-size: 15px; line-height: 1.5; margin: 0; }
.wl-steps { counter-reset: w; display: flex; flex-direction: column; gap: 14px; margin: 0; padding: 0; list-style: none; }
.wl-steps li { counter-increment: w; display: grid; grid-template-columns: 30px 1fr; column-gap: 12px; row-gap: 2px; }
.wl-steps li::before { content: counter(w); grid-row: span 2; width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-ink); font-weight: 800; font-size: 13px; display: grid; place-items: center; }
.wl-steps b { font-size: 15px; }
.wl-steps span { color: var(--ink-2); font-size: 14px; line-height: 1.45; }
.wl-foot { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
@media (max-width: 640px) { .modal.welcome { padding: 24px 20px 20px; } .wl-head h2 { font-size: 24px; } .wl-foot .btn { width: 100%; } }

/* ——— Importera bokningar ——— */
.gap8 { gap: 8px; }
.modal.import { width: min(860px, 100%); max-height: calc(100% - 8px); }
.imp-body { padding: 4px 24px 18px; overflow: auto; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
.dropzone { border: 2px dashed var(--line-2); border-radius: 16px; padding: 32px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; background: var(--surface-2); transition: border-color .15s, background .15s; }
.dropzone.on { border-color: var(--brand); background: var(--brand-soft); }
.dropzone b { font-size: 16px; }
.dropzone .row { margin-top: 8px; }
.dz-ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--surface); color: var(--brand); box-shadow: var(--sh-1); }
.imp-err { display: flex; gap: 8px; align-items: flex-start; color: var(--crit); background: var(--crit-soft); padding: 10px 12px; border-radius: 10px; margin: 0; }
.imp-info { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; font-size: 13px; }
.imp-info > div { display: flex; gap: 8px; align-items: flex-start; }
.imp-info > div:first-child { flex-direction: column; gap: 2px; }
.imp-info svg { flex: none; margin-top: 2px; color: var(--brand); }
.map-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 14px; }
.map-row i { font-style: normal; color: var(--crit); font-weight: 700; }
.map-row em { font-style: normal; font-size: 11.5px; color: var(--ink-3); }
.map-row.missing select { box-shadow: inset 0 0 0 1.5px var(--crit); }
.imp-vets { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); }
.imp-vets .lbl { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
.imp-vets .seg { align-self: flex-start; }
.imp-vets > .muted { font-size: 12.5px; }
.imp-sum { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.imp-sum .sum { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; padding: 5px 10px; border-radius: 999px; }
.imp-sum .sum.ok { background: var(--ok-soft, #E4F4E6); color: var(--ok, #1E6B34); }
.imp-sum .sum.warn { background: var(--warn-soft); color: var(--warn); }
.imp-sum .sum.bad { background: var(--crit-soft); color: var(--crit); }
.imp-sum .muted { font-size: 12.5px; }
.imp-rows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.imp-row { display: grid; grid-template-columns: 22px 48px minmax(0, 1fr) 130px; gap: 4px 10px; align-items: start; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 13px; }
.imp-row:first-child { border-top: 0; }
.imp-row.bad { background: var(--crit-soft); }
.ir-ic { padding-top: 1px; }
.imp-row.ok .ir-ic { color: var(--ok, #1E6B34); }
.imp-row.warn .ir-ic { color: var(--warn); }
.imp-row.bad .ir-ic { color: var(--crit); }
.ir-time { font-weight: 700; }
.ir-main { display: flex; flex-wrap: wrap; gap: 2px 8px; min-width: 0; }
.ir-main .muted { font-size: 12.5px; }
.ir-issue { flex-basis: 100%; font-size: 12px; }
.ir-issue.kontroll { color: var(--warn); }
.ir-issue.fel { color: var(--crit); font-weight: 700; }
.ir-vet { font-size: 12.5px; color: var(--ink-2); text-align: right; }
.ir-fix { grid-column: 3 / 5; height: 34px; border-radius: 9px; border: 0; box-shadow: inset 0 0 0 1px var(--line-2); padding: 0 10px; background: var(--surface); max-width: 260px; }
.foot-note { margin-right: auto; align-self: center; font-size: 12.5px; color: var(--ink-3); }
@media (max-width: 900px) { .map-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.opstatus, .tb-right .btn { white-space: nowrap; flex: none; }
.search { min-width: 150px; }
.dmain { container-type: inline-size; container-name: dmain; }
@container dmain (max-width: 1330px) {
  .tb-title .muted { display: none; }
  .search { max-width: 220px; }
}
@container dmain (max-width: 1180px) {
  .tb-import span { display: none; }
  .tb-import { padding: 0 11px; }
}

/* ——— Operations layer ——— */
.alert.tone-watch { background: #FBF7EC; box-shadow: inset 0 0 0 1px #EFE4C6; grid-template-columns: 32px 1fr; align-items: start; }
.alert.tone-watch > .btn { grid-column: 2; justify-self: start; margin-top: 6px; }
.alert.tone-watch .alert-ic, .alert-ic.tone-watch { color: #8A6A12; background: #FFFBF0; }
.daystats.ops > .risk { display: flex; flex-direction: column; padding: 0 14px; border-right: 1px solid var(--line); white-space: nowrap; text-align: left; border-radius: 0; }
.daystats.ops > button.risk { cursor: pointer; margin: -6px 0; padding: 6px 14px; border-radius: 10px; border-right: 0; }
.daystats.ops > button.risk + div { border-left: 1px solid var(--line); }
.daystats.ops > .risk.bevaka { background: #FBF7EC; }
.daystats.ops > .risk.atgarda { background: var(--warn-soft); }
.daystats.ops > .risk.bevaka b, .daystats.ops > .risk.atgarda b { color: var(--warn); }
.daystats.ops > .risk.ok b { color: var(--ok, #1E6B34); }
.daystats.ops > .risk > span { font-size: 11.5px; color: var(--ink-3); }
.daystats.ops > button.risk:hover { box-shadow: inset 0 0 0 1px #EBD9A8; }
.chip.cap { gap: 6px; }
.chip.cap i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.cap-ledig { background: #E4F4E6; color: #1E6B34; }
.chip.cap-balanserad { background: var(--sunken); color: var(--ink-2); }
.chip.cap-hog { background: #FBF7EC; color: #8A6A12; }
.chip.cap-risk { background: var(--warn-soft); color: var(--warn); }
.chip.cap-klar { background: var(--sunken); color: var(--ink-3); }
.status-steps { display: flex; list-style: none; margin: 0; padding: 0; gap: 0; }
.status-steps li { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; position: relative; font-size: 11.5px; color: var(--ink-3); min-width: 0; }
.status-steps li i { width: 100%; height: 4px; border-radius: 2px; background: var(--line); margin-bottom: 3px; }
.status-steps li + li i { margin-left: 3px; width: calc(100% - 3px); }
.status-steps li.done i, .status-steps li.now i { background: var(--brand); }
.status-steps li.now span { color: var(--ink); font-weight: 700; }
.status-steps li.done span { color: var(--ink-2); }
.status-steps em { font-style: normal; font-size: 11px; color: var(--ink-3); }
.vc-capline { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; }
.vc-capline .muted { font-size: 12px; }
.vc-risk { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; padding: 5px 8px; border-radius: 8px; }
.vc-risk.bevaka { background: #FBF7EC; color: #6E5410; }
.vc-risk.atgarda { background: var(--warn-soft); color: var(--warn); }
.vc-risk b { color: inherit; }
.dr-steps { padding: 4px 20px 12px; }
.map-teamcard { position: absolute; z-index: 6; transform: translate(-50%, calc(-100% - 26px)); pointer-events: auto; }
.map-teamcard.below { transform: translate(-50%, 26px); }
.teamcard { width: 300px; background: var(--surface); border-radius: 16px; box-shadow: var(--sh-3); padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 10px; animation: pop .2s cubic-bezier(.2,.9,.3,1.1); }
.tc-head { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; }
.tc-name { display: flex; flex-direction: column; min-width: 0; }
.tc-name b { font-size: 14px; }
.tc-name .muted { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn.sm { width: 28px; height: 28px; }
.tc-status { display: flex; gap: 6px; flex-wrap: wrap; }
.tc-next { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: baseline; text-align: left; padding: 9px 10px; border-radius: 11px; background: var(--surface-2); width: 100%; font-size: 13px; }
.tc-next:hover { background: var(--sunken); }
.tc-next > .muted:first-child { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.tc-next > b { grid-column: 2; }

.tc-eta { grid-column: 3; grid-row: 1; text-align: right; }
.tc-dev { grid-column: 3; grid-row: 2; font-size: 12px; color: var(--ok, #1E6B34); text-align: right; white-space: nowrap; }
.tc-dev.late { color: var(--warn); font-weight: 700; }
.tc-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
.sug-cap { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; flex-wrap: wrap; }
.fix-note { font-size: 12.5px; margin: -4px 0 8px; }
.nc-updated { display: flex; align-items: center; gap: 6px; margin: 2px 0 0; font-size: 12.5px; font-weight: 700; color: var(--brand-ink); background: var(--brand-soft); padding: 5px 9px; border-radius: 9px; align-self: flex-start; }
.phone-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.phone-switch { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); background: var(--surface); padding: 4px 6px 4px 12px; border-radius: 999px; box-shadow: var(--sh-1); }
.phone-switch select { border: 0; background: var(--surface-2); border-radius: 999px; height: 28px; padding: 0 10px; font-weight: 700; color: var(--ink); }
/* Summary and vet filter share one row when there is room (filter to the right);
   on narrower maps the filter tucks in directly under the summary instead of floating mid-map. */
.map-top { flex-wrap: wrap; justify-content: flex-start; row-gap: 8px; container-type: inline-size; }
@container (min-width: 860px) { .map-top > .vetfilter { margin-left: auto; } }

/* ——— Phase 2: urgent intake, impact, customer ETA, clinic handoff, demo story ——— */
.rail-me { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.rail-role { font-size: 9.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }

.tag.fit { margin-left: 0; }
.tag.fit-bast { background: var(--brand); color: #fff; }
.tag.fit-mojlig { background: var(--sunken); color: var(--ink-2); }
.tag.fit-stor { background: var(--warn-soft); color: var(--warn); }
.tag.fit-ej { background: transparent; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line-2); }
.sug.fit-stor .sug-why { color: var(--warn); }
.sug-eta b { white-space: nowrap; }
.fit-note { font-size: 11.5px; color: var(--ink-3); margin: 6px 2px 0; line-height: 1.4; }

.seg.urg { display: flex; width: 100%; }
.seg.urg button { flex: 1; justify-content: center; }
.uform > .field > span { font-size: 12px; font-weight: 700; color: var(--ink-2); }
.equip-hint.inline { margin: 0; padding: 8px 10px; min-height: 40px; display: flex; align-items: center; }
.more-toggle { align-self: flex-start; font-size: 13px; }

.dr-eta, .dr-handoff { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; margin: 8px 16px 2px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-3); }
.dr-eta > span, .dr-handoff > span { display: flex; flex-direction: column; font-size: 12.5px; color: var(--ink-2); min-width: 0; }
.dr-eta b, .dr-handoff b { color: var(--ink); font-size: 13px; }
.dr-eta.sent { background: var(--ok-soft); box-shadow: inset 0 0 0 1px #C9E6D4; color: var(--ok); }
.dr-handoff { background: #EEF0FA; box-shadow: inset 0 0 0 1px #D8DCF3; color: #4250A8; }
.dr-handoff.ny { background: var(--warn-soft); box-shadow: inset 0 0 0 1px #F0DDB0; color: var(--warn); }
.t-clinic { background: #EEF0FA; color: #4250A8; display: inline-flex; gap: 3px; align-items: center; }

.vtl { list-style: none; display: flex; flex-direction: column; gap: 0; margin: 0; padding: 0; }
.vtl li { display: grid; grid-template-columns: 44px 1fr; gap: 8px; font-size: 12.5px; padding: 5px 0 5px 12px; position: relative; color: var(--ink-2); }
.vtl li::before { content: ''; position: absolute; left: 0; top: 11px; width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); }
.vtl li:not(:last-child)::after { content: ''; position: absolute; left: 2.5px; top: 19px; bottom: -5px; width: 1px; background: var(--line); }
.vtl li > span:first-child { color: var(--ink-3); }
.vtl em { font-style: normal; color: var(--ink-3); margin-left: 6px; }
.vtl li.clinic::before, .vtl li.future::before { background: #5663C4; }
.vtl li.future { color: #4250A8; font-weight: 600; }

.ho-card { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; box-shadow: inset 0 0 0 1px var(--line); display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.ho-facts { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; margin: 0; }
.ho-facts dt { color: var(--ink-3); font-size: 12.5px; }
.ho-facts dd { margin: 0; }
.fix-top svg { flex: none; color: var(--ink-3); }
.fix-top b { margin-right: auto; }
.ho-after { margin-top: 10px; }

.modal.customer { width: min(860px, 100%); }
.cust-body { display: grid; grid-template-columns: 1fr 340px; gap: 22px; padding: 4px 24px 24px; align-items: start; }
.cust-info { display: flex; flex-direction: column; gap: 14px; font-size: 13.5px; }
.cust-facts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.cust-facts li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; color: var(--ink-2); }
.cust-facts svg { color: var(--brand); margin-top: 2px; }
.cust-none { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; background: var(--surface-2); padding: 14px; border-radius: 14px; }
.cust-phone { background: #EEF0EC; border-radius: 28px; padding: 16px 14px; box-shadow: inset 0 0 0 6px #1D252C; display: flex; flex-direction: column; gap: 12px; min-height: 420px; }
.cust-sms { align-self: flex-start; max-width: 92%; background: #fff; border-radius: 16px 16px 16px 4px; padding: 9px 12px; font-size: 12.5px; line-height: 1.4; box-shadow: var(--sh-1); }
.cust-page { background: #fff; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--sh-1); }
.cp-brand { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.cp-brand .muted { margin-left: auto; }
.cust-page h4 { font-family: var(--f-display); font-size: 20px; line-height: 1.2; margin: 0; }
.cp-eta { display: flex; flex-direction: column; background: var(--brand-tint); border-radius: 12px; padding: 10px 12px; }
.cp-eta span { font-size: 12px; }
.cp-eta b { font-size: 24px; font-family: var(--f-display); color: var(--brand-ink); }
.cp-updated { font-size: 12px; color: var(--warn); margin: -4px 0 0; }
.cp-steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; font-size: 11px; color: var(--ink-3); }
.cp-steps li { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.cp-steps i { width: 18px; height: 18px; border-radius: 50%; background: var(--sunken); display: grid; place-items: center; color: #fff; }
.cp-steps li.done i { background: var(--brand); }
.cp-steps li.now { color: var(--ink); font-weight: 700; }
.cp-steps li.now i { background: #fff; box-shadow: inset 0 0 0 5px var(--brand); }
.cp-contact { display: grid; grid-template-columns: 16px 1fr; gap: 8px; font-size: 12px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 10px; }

/* mobile */
.sb-icons { display: inline-flex; align-items: center; gap: 5px; }
.syncpill { display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 7px; border-radius: 9px; font-size: 10.5px; font-weight: 700; letter-spacing: 0; text-transform: none; background: var(--ok-soft); color: var(--ok); margin-left: 6px; transition: background .2s; white-space: nowrap; }
.syncpill.busy { background: var(--nav-soft); color: var(--nav); }
.syncpill.off { background: var(--sunken); color: var(--ink-2); }
.spin-ic { animation: spin 1s linear infinite; }
.mbanner.urgent { grid-template-columns: 32px 1fr auto; background: var(--crit-soft); box-shadow: inset 0 0 0 1px #F0C9C4; }
.mbanner.urgent .mb-ic { background: var(--crit); color: #fff; }
.nc-ready { display: flex; flex-wrap: wrap; gap: 5px; }
.nc-ready > span { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 8px; font-size: 12px; font-weight: 600; background: var(--ok-soft); color: var(--ok); }
.nc-ready > span.warn { background: var(--warn-soft); color: var(--warn); }
.nc-ready > span.park { background: var(--nav-soft); color: var(--nav); }
.nc-sent { display: flex; align-items: flex-start; gap: 6px; font-size: 12.5px; color: var(--ink-2); margin: 0; }
.nc-sent svg { color: var(--ok); flex: none; margin-top: 2px; }
.ho-btn { width: 100%; }
.ho-status { flex-direction: row; align-items: center; gap: 12px; background: #EEF0FA; box-shadow: inset 0 0 0 1px #D8DCF3; color: #4250A8; }
.ho-status > div { display: flex; flex-direction: column; font-size: 13.5px; color: var(--ink); }
.ho-status.ny { background: var(--brand-tint); box-shadow: inset 0 0 0 1px var(--brand-soft); }
.ho-form { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 6px; }
.ho-lbl { font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
.ho-form textarea { width: 100%; border-radius: 12px; border: 1px solid var(--line-2); padding: 10px 12px; font: inherit; font-size: 14px; resize: none; }
.seg.m3 { display: flex; }
.seg.m3 button { flex: 1; justify-content: center; }

/* guided demo story */
.dm-story { background: var(--brand-tint); margin-bottom: 4px; }
.dm-story > span { display: flex; flex-direction: column; text-align: left; }
.dm-story > span span { font-weight: 500; font-size: 12px; color: var(--ink-2); }
.dm-story svg { color: var(--brand); }
.story { position: fixed; left: 16px; bottom: 16px; z-index: 80; width: 360px; background: var(--surface); border-radius: 18px; box-shadow: 0 24px 60px -18px rgba(22, 34, 44, .45), 0 0 0 1px rgba(22, 34, 44, .08); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; animation: rise .3s ease-out; }
.story-head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; }
.story-head > span { margin-right: auto; }
.story-head em { font-style: normal; color: var(--ink-3); font-weight: 600; }
.story-dots { display: flex; gap: 4px; }
.story-dots i { flex: 1; height: 4px; border-radius: 2px; background: var(--sunken); }
.story-dots i.done { background: var(--brand); }
.story-dots i.now { background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--brand); }
.story-body { display: flex; flex-direction: column; gap: 8px; }
.story-title { font-family: var(--f-display); font-size: 17px; line-height: 1.25; }
.story-body p { font-size: 13.5px; line-height: 1.45; color: var(--ink-2); margin: 0; }
.story-hint { display: flex; align-items: center; gap: 6px; font-size: 12px !important; color: var(--ink-3) !important; }
.story-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
.story-ok { display: inline-flex; align-items: center; gap: 5px; color: var(--ok); font-weight: 700; font-size: 13px; }
.story-sum { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-2); }
.story-sum li { display: grid; grid-template-columns: 16px 1fr; gap: 6px; }
.story-sum svg { color: var(--ok); margin-top: 3px; }
.story-mini { position: fixed; left: 16px; bottom: 16px; z-index: 80; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 18px; background: var(--ink); color: #fff; font-weight: 700; font-size: 13px; box-shadow: var(--sh-2); }
.btn.pulse { animation: storypulse 1.6s ease-in-out infinite; }
@keyframes storypulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(42, 120, 103, .45); } 50% { box-shadow: 0 0 0 6px rgba(42, 120, 103, 0); } }
.demo-spot { outline: 3px solid #F2A93B !important; outline-offset: 3px; border-radius: 12px; animation: spotpulse 1.4s ease-in-out infinite; position: relative; z-index: 5; }
@keyframes spotpulse { 0%, 100% { outline-color: #F2A93B; } 50% { outline-color: rgba(242, 169, 59, .35); } }

/* ——— Clarity pass: coordinator ——— */
.tb-title { align-items: center; min-width: 0; }
.daysum { display: flex; align-items: center; gap: 4px; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; min-width: 0; }
.daysum > span { padding: 0 8px; border-left: 1px solid var(--line); }
.daysum > span:nth-child(2) { border-left: 0; }
.daysum b { color: var(--ink); font-weight: 700; }
.ds-state { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 10px; font-weight: 700; font-size: 13px; margin-right: 6px; transition: transform .12s; }
.ds-state:active { transform: scale(.98); }
.ds-state.ok { background: var(--ok-soft); color: var(--ok); }
.ds-state.warn { background: var(--warn-soft); color: var(--warn); }
.search { max-width: 300px; }
.more-wrap { position: relative; }
.menu { position: absolute; top: calc(100% + 8px); right: 0; min-width: 280px; background: var(--surface); border-radius: 14px; box-shadow: var(--sh-3); padding: 6px; z-index: 40; display: flex; flex-direction: column; animation: menuIn .14s ease-out; }
.menu.up { top: auto; bottom: calc(100% + 8px); left: 0; right: auto; min-width: 220px; }
.menu button { display: flex; align-items: flex-start; gap: 10px; padding: 10px; border-radius: 10px; text-align: left; font-size: 13.5px; font-weight: 700; color: var(--ink); }
.menu button svg { flex: none; margin-top: 2px; color: var(--ink-3); }
.menu button:hover, .menu button:focus-visible { background: var(--surface-2); outline: 0; }
.menu button span { display: flex; flex-direction: column; }
.menu button em { font-style: normal; font-weight: 500; font-size: 12px; color: var(--ink-3); }
.menu button.danger, .menu button.danger svg { color: var(--crit); }
@keyframes menuIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.side-sec.attention .sec-head h2 { font-size: 16px; }
.sec-head .count { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--warn-soft); color: var(--warn); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.alert { grid-template-columns: 32px 1fr !important; align-items: start !important; gap: 2px 10px; transition: box-shadow .15s, transform .15s; animation: rise .25s ease-out; }
.alert > .btn { grid-column: 2; justify-self: start; margin-top: 8px; }
.alert-kicker { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 1px; }
.alert.cat-drift.tone-warn .alert-kicker, .alert.cat-drift.tone-watch .alert-kicker { color: var(--warn); }
.alert.cat-klinisk { background: #FCEDEE; box-shadow: inset 0 0 0 1px #F2CDD1, inset 4px 0 0 var(--crit); }
.alert.cat-klinisk .alert-kicker { color: var(--crit); }
.alert.cat-klinisk .alert-ic { color: var(--crit); background: #FFF6F6; }
.alert.cat-klinisk.tone-info { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line), inset 4px 0 0 #E8A7AE; }
.alert-btn { background: var(--ink); color: #fff; }
.alert-btn:hover { background: #26353F; }
.alert.cat-klinisk .alert-btn { background: var(--crit); }
.alert.tone-info:not(.cat-klinisk) .alert-btn { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.more-alerts { align-self: flex-start; margin-top: 2px; }
.flip { transform: rotate(180deg); }
.link svg { transition: transform .15s; }
.calm { animation: rise .25s ease-out; }

.vetcard { gap: 4px; padding: 11px 12px 13px; }
.vetcard.sel { box-shadow: inset 0 0 0 2px var(--brand); }
.vc-top { align-items: flex-start; }
.vc-main { display: flex; flex-direction: column; flex: 1; min-width: 0; gap: 1px; text-align: left; }
.vc-main b { font-size: 14px; }
.vc-line { font-size: 12.5px; color: var(--ink-2); line-height: 1.35; }
.vc-line em { font-style: normal; color: var(--ink-3); }
.vc-line em.late { color: var(--warn); font-weight: 700; }
.vc-count { font-size: 12px; color: var(--ink-3); font-weight: 700; margin-top: 2px; }
.vc-risk { margin: 6px 0 0 42px; background: var(--warn-soft); color: var(--warn); text-align: left; }
.vc-risk b { color: var(--ink); }
.vc-note { margin: 4px 0 0 42px; font-size: 12px; color: var(--ink-3); text-align: left; }
.vc-capline { margin: 4px 0 0 42px; font-size: 12px; color: var(--ok); font-weight: 600; }
.vc-capline.full { color: var(--ink-3); }

.vd-sum { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.vd-sum b { color: var(--ink); }
.vd-act { margin-left: auto; display: flex; gap: 6px; }
.ctx-alert { display: flex; align-items: center; gap: 8px; margin: 10px 16px 0; padding: 9px 12px; border-radius: 11px; font-size: 13px; text-align: left; background: var(--warn-soft); color: var(--warn); width: calc(100% - 32px); }
.ctx-alert span { flex: 1; color: var(--ink); font-weight: 600; }
.ctx-alert b { display: inline-flex; align-items: center; font-size: 12.5px; white-space: nowrap; }
.ctx-alert:hover { filter: brightness(.98); }
.ctx-alert.cat-klinisk { background: #FCEDEE; color: var(--crit); }
.ctx-alert.cat-info { background: var(--surface-2); color: var(--ink-3); }
.dr-ctx { margin-top: 8px; }
.t-akut { background: #FCE4E6; color: var(--crit); display: inline-flex; gap: 3px; align-items: center; }
.ph-title b .tag { vertical-align: 2px; margin-left: 8px; }
.dr-when { grid-template-columns: 1fr 1.3fr; }
.dr-when b em { font-style: normal; font-size: 12px; font-weight: 700; margin-left: 4px; }
.dr-when b em.ok { color: var(--ok); }
.dr-when b em.late { color: var(--warn); }
.dr-eta .link { white-space: nowrap; }
.dr-history { margin: 4px 0 8px; }
.confirm-row { display: flex; align-items: center; gap: 8px; width: 100%; font-size: 13.5px; font-weight: 600; }
.confirm-row span { flex: 1; }
.btn.danger-solid { background: var(--crit); color: #fff; }
.panel-foot .more-wrap .btn { height: 38px; }
.ph-ic { width: 36px; height: 36px; border-radius: 11px; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-2); }
.hist-list { list-style: none; margin: 4px 0 12px; padding: 0; display: flex; flex-direction: column; }
.hist-list li { display: grid; grid-template-columns: 46px 1fr; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.hist-list li > span:first-child { color: var(--ink-3); }
.hist-list em { display: block; font-style: normal; color: var(--ink-3); font-size: 12px; }

.why-line { margin: 14px 0 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.45; }
.reco { margin-top: 14px; padding: 16px; border-radius: 16px; background: var(--brand-tint); box-shadow: inset 0 0 0 1.5px var(--brand-soft); display: flex; flex-direction: column; gap: 6px; cursor: pointer; animation: rise .25s ease-out; transition: box-shadow .15s; }

.cp-contact { grid-template-columns: 1fr; gap: 8px; }

.nextcard { gap: 12px; }
.nc-patient b { font-size: 32px; }

.nc-crit { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

.later { display: grid; grid-template-columns: 1fr 18px; align-items: center; gap: 10px; width: 100%; padding: 13px 14px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); text-align: left; color: var(--ink-3); }

.mcta { display: flex; flex-direction: column; gap: 8px; margin-top: auto; padding-top: 14px; }
.mscreen.today { min-height: 100%; }
.mbtn.primary.nav { background: var(--nav); box-shadow: 0 6px 16px -8px var(--nav); }
.mbtn { transition: transform .1s, background .15s, box-shadow .15s; }

.donecard { gap: 8px; }
.donecard .later { text-align: left; }
.stepper.five { grid-template-columns: repeat(5, 1fr); }
.m-more { align-self: flex-start; font-size: 14px; padding: 4px 2px; }
.owner-m { align-items: center; }

/* Akutärende: adress skrivs in manuellt */

.addr { display: flex; flex-direction: column; gap: 6px; }

.iv-head { grid-template-columns: 44px 1fr auto; }
.mcard.hist-open { flex-direction: row; align-items: center; gap: 12px; text-align: left; border: 0; font: inherit; color: var(--ink); cursor: pointer; padding: 13px 16px; }

.mhist { position: absolute; inset: 50px 0 0; z-index: 25; background: var(--bg); overflow: auto; padding: 8px 18px 28px; display: flex; flex-direction: column; gap: 12px; animation: hist-in .18s ease-out; overscroll-behavior: contain; }
@keyframes hist-in { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.hist-head { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; }
.hist-head > div { display: flex; flex-direction: column; }

.hist-src { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 12px; color: var(--ink-3); }
.hist-src .spin { width: 14px; height: 14px; border-width: 2px; }
.phist-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.mhist .phist-list > li.hist-item { display: flex; flex-direction: column; align-items: stretch; }
.hist-item { background: var(--surface); border-radius: 16px; padding: 12px 14px; box-shadow: inset 0 0 0 1px var(--line); display: flex; flex-direction: column; gap: 6px; }

.hi-tags li.dx { background: #EEF0FA; color: #4250A8; }
.hi-tags li.rx { background: var(--brand-soft); color: var(--brand-ink, var(--brand)); }
.hi-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; }

.hi-note { white-space: pre-wrap; font-size: 13px !important; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: flex; gap: 6px; align-items: center; }

.hist-skel { background: var(--surface); border-radius: 16px; padding: 14px; box-shadow: inset 0 0 0 1px var(--line); display: flex; flex-direction: column; gap: 8px; }
.hist-skel i { height: 10px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2) 25%, var(--line) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: skel 1.2s linear infinite; }
.hist-skel i:nth-child(1) { width: 45%; height: 12px; }

.hist-provet .mbtn { white-space: nowrap; flex: none; }

/* ——— Teamtavlan: en rad per team, från nu och framåt ——— */
.ds-state.crit { background: var(--crit-soft); color: var(--crit); }
.work.v2 { grid-template-columns: minmax(0, 1fr) 384px; }
.plancol { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.mapwrap.below { flex: 1; min-height: 220px; border-top: 1px solid var(--line); }
.board { position: relative; background: var(--surface); padding: 14px 20px 10px; user-select: none; flex: none; border-bottom: 1px solid var(--line); }

.b-head { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }

.lg { width: 14px; height: 9px; border-radius: 3px; display: inline-block; }

.lg.late { background: var(--warn-soft); box-shadow: inset 0 0 0 1px var(--warn-solid); }

.b-map { height: 30px; }
.btn.sm { height: 30px; padding: 0 11px; font-size: 12.5px; gap: 6px; }
.b-axis { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 14px; height: 18px; }
.b-scale { position: relative; font-size: 11px; color: var(--ink-4); }
.b-scale span { position: absolute; transform: translateX(-50%); top: 1px; }
.b-nowlbl { position: absolute; transform: translateX(-50%); top: -1px; background: var(--crit); color: #fff; font-size: 10.5px; padding: 1px 6px; border-radius: 5px; z-index: 3; white-space: nowrap; }
.brow { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 14px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); transition: opacity .2s; }
.brow.dim { opacity: .45; }
.brow.dim:hover { opacity: .8; }
.brow.drop .btrack { box-shadow: inset 0 0 0 2px var(--nav); background: var(--nav-soft); }
.bhead { display: grid; grid-template-columns: 30px 1fr; grid-template-rows: auto auto; column-gap: 10px; row-gap: 6px; align-items: center; text-align: left; padding: 6px 8px; margin: -6px -8px; border-radius: 12px; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; }
.bhead:hover, .brow.sel .bhead { background: var(--surface-2); }

.bh-name { display: flex; flex-direction: column; line-height: 1.2; }

.blane { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.bline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); min-height: 22px; }
.bline > span:first-child { color: var(--ink); font-weight: 600; }
.bline svg { vertical-align: -2px; }
.b-dev { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 8px; font-size: 12.5px; font-weight: 700; border: 0; font-family: inherit; }
button.b-dev { cursor: pointer; }

.b-chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 7px; font-size: 12px; font-weight: 600; background: var(--sunken); color: var(--ink-2); }

.b-chip .spin { width: 11px; height: 11px; border-width: 2px; }
.brow.t-stale .bline > span:first-child { color: var(--ink-3); font-weight: 500; }
.btrack { position: relative; height: 38px; border-radius: 10px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; transition: box-shadow .15s, background .15s; }
.b-past { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(22, 34, 44, .035); }
.b-off { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, transparent 0 5px, rgba(22, 34, 44, .045) 5px 10px); }
.b-grid { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); opacity: .7; }
.b-now { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: var(--crit); z-index: 3; border-radius: 1px; }
.b-gap { position: absolute; top: 5px; bottom: 5px; border-radius: 8px; box-shadow: inset 0 0 0 1px #9CD0B2; background: repeating-linear-gradient(135deg, transparent 0 4px, rgba(44, 132, 85, .07) 4px 8px); display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; color: var(--ok); overflow: hidden; white-space: nowrap; }
.b-drive { position: absolute; top: 50%; height: 2px; margin-top: -1px; background: repeating-linear-gradient(90deg, var(--ink-4) 0 4px, transparent 4px 8px); }
.b-drive.done { opacity: .4; }
.b-drive.active { background: var(--nav); height: 3px; margin-top: -1.5px; }
.b-visit { position: absolute; top: 5px; bottom: 5px; min-width: 22px; border-radius: 8px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2), var(--sh-1); display: flex; align-items: center; gap: 5px; padding: 0 8px; font-size: 12.5px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; cursor: pointer; z-index: 2; transition: box-shadow .15s, transform .12s, background .2s; }
.b-visit:hover { box-shadow: inset 0 0 0 1.5px var(--ink-3), var(--sh-2); }
.b-visit svg { flex: none; color: var(--ink-3); }
.b-visit .bv-name { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 0 auto; max-width: 100%; }
.b-visit .bv-time, .b-visit .bv-late { flex: 0 1 auto; min-width: 0; overflow: hidden; }
.b-visit .bv-time, .b-visit .bv-late { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--ink-3); padding-left: 4px; }
.b-visit.narrow { padding: 0 4px; justify-content: center; }
.b-visit.narrow .bv-time, .b-visit.narrow .bv-late, .b-visit.narrow svg { display: none; }
.b-visit.st-klar { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-3); font-weight: 600; }
.b-visit.st-klar svg { color: var(--ok); }
.b-visit.st-pågår, .b-visit.st-framme { background: var(--brand-soft); box-shadow: inset 0 0 0 1.5px var(--brand); color: var(--brand-ink); }
.b-visit.st-påväg { box-shadow: inset 0 0 0 1.5px var(--nav), var(--sh-1); }
.b-visit.late { background: var(--warn-soft); box-shadow: inset 0 0 0 1.5px var(--warn-solid); color: var(--warn); }
.b-visit.late svg, .b-visit.late .bv-late { color: var(--warn); }
.b-visit.akut::after { content: ''; position: absolute; right: 4px; top: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--crit); }
.b-visit.locked { box-shadow: inset 0 0 0 1.5px var(--ink-3), var(--sh-1); }
.b-visit.sel { box-shadow: inset 0 0 0 2px var(--ink), var(--sh-2); z-index: 4; }
.b-visit.chain { background: var(--warn-soft); box-shadow: inset 0 0 0 1.5px var(--warn-solid), 0 0 0 3px rgba(224, 161, 42, .25); }
.b-visit.dragging { opacity: .35; }
.b-visit.flash { animation: bflash 2.4s ease-out; }
@keyframes bflash { 0%, 35% { box-shadow: inset 0 0 0 2px var(--brand), 0 0 0 5px rgba(42, 120, 103, .28); transform: translateY(-1px); } 100% { transform: none; } }
.b-ghost { position: absolute; bottom: 2px; height: 2px; border-radius: 1px; background: repeating-linear-gradient(90deg, var(--ink-3) 0 3px, transparent 3px 6px); z-index: 1; }
.b-edge { position: absolute; top: 9px; height: 20px; padding: 0 7px; border-radius: 6px; border: 0; font: inherit; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 3px; background: var(--surface); color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line-2); cursor: pointer; z-index: 5; }
.b-edge.l { left: 6px; }
.b-edge.r { right: 6px; }
.b-edge:hover { color: var(--ink); }
.b-drophint { position: absolute; left: 10px; right: 10px; top: 50%; transform: translateY(-50%); z-index: 6; text-align: center; background: var(--ink); color: #fff; font-size: 12.5px; font-weight: 600; padding: 6px 10px; border-radius: 9px; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-drophint.bad { background: var(--crit); }
.board .tl-dragghost { z-index: 40; }
.nexthour { display: flex; flex-direction: column; }
.nh-row { display: grid; grid-template-columns: 46px 1fr; gap: 8px; text-align: left; padding: 9px 4px; border: 0; border-top: 1px solid var(--line); background: none; font: inherit; font-size: 13px; color: var(--ink-2); border-radius: 0; cursor: pointer; }
.nh-row:first-child { border-top: 0; }
.nh-row:hover:not(:disabled) { background: var(--surface-2); }
.nh-row:disabled { cursor: default; }
.nh-row > span:first-child { color: var(--ink-3); font-weight: 600; }
.nh-row b { color: var(--ink); }
.nh-row.warn > span:last-child { color: var(--warn); }
.nh-row.warn b { color: var(--warn); }
.nh-row.free > span:last-child { color: var(--ok); }
.nh-row.free b { color: var(--ok); }
@container dmain (max-width: 1180px) { .b-legend { display: none; } .b-axis, .brow { grid-template-columns: 160px minmax(0, 1fr); } }
.b-more { margin-left: auto; height: 22px; padding: 0 8px; border-radius: 7px; border: 0; font: inherit; font-size: 12px; font-weight: 600; color: var(--ink-3); background: none; cursor: pointer; }
.b-more:hover { color: var(--ink); background: var(--sunken); }

/* ——— Veterinären: dagens stapel, körläge och dagens slut ——— */
.mprog { display: flex; gap: 3px; margin-top: 8px; max-width: 220px; }
.mprog i { flex: 1; height: 4px; border-radius: 2px; background: var(--sunken); }
.mprog i.d { background: var(--brand); }
.mprog i.n { background: var(--nav); }
.mprog i.l { background: var(--warn-solid); }
.nc-crit.drive li.code { font-family: var(--f-mono); font-size: 15px; color: var(--ink); font-weight: 600; }
.nextcard.st-påväg .nc-map { height: 104px; }
.day-stats { display: flex; justify-content: center; gap: 22px; margin-top: 14px; }
.day-stats span { display: flex; flex-direction: column; font-size: 12px; color: var(--ink-3); }
.day-stats b { font-family: var(--f-display); font-size: 24px; color: var(--ink); }
.rail-btn.sep { margin-top: auto; }
.rail-btn.minor { padding: 7px 0 5px; }
.rail-btn.minor svg { width: 18px; height: 18px; }
</style>
